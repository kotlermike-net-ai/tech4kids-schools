<style>
:root{
  --bg:#000;--panel:#0b0b0b;--panel2:#151515;--line:#2b2b2b;
  --text:#fff;--muted:#b9b9b9;--accent:#1A9FFF;--accent-soft:rgba(26,159,255,.14);--accent-line:rgba(26,159,255,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",system-ui,sans-serif;font-size:19px;line-height:1.65;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 56px}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0 10px}
header h1{margin:0;font-size:clamp(22px,4.2vw,34px);line-height:1.2}
header p{margin:4px 0 0;color:var(--muted);font-size:16px}
.logo{width:56px;height:56px;border-radius:8px;flex:none;display:block}

/* road / progress */
.road{position:relative;height:96px;margin:8px 0 18px}
.road .line{position:absolute;right:0;left:0;top:50px;height:6px;background:var(--line);border-radius:3px}
.road .fill{position:absolute;right:0;top:50px;height:6px;background:var(--accent);border-radius:3px;width:0;transition:width .7s cubic-bezier(.5,.1,.2,1)}
.road .dot{position:absolute;top:47px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--line);transform:translateX(50%);transition:border-color .4s,background .4s}
.road .dot.on{border-color:var(--accent);background:var(--accent)}
.road .dot span{position:absolute;top:20px;right:50%;transform:translateX(50%);white-space:nowrap;font-size:14px;color:var(--muted)}
.road .dot.cur span{color:var(--accent);font-weight:700}
.car{position:absolute;top:18px;width:64px;height:30px;transform:translateX(50%);transition:right .7s cubic-bezier(.5,.1,.2,1)}
.car svg{display:block;width:64px;height:30px;overflow:visible}
.car .wheel{transform-box:fill-box;transform-origin:center}
.car.moving .wheel{animation:spin .5s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.flag{position:absolute;left:-2px;top:20px;width:26px;height:36px}
@media(max-width:700px){.road .dot span{display:none}.road{height:72px}.road .line,.road .fill{top:42px}.road .dot{top:39px}.car{top:10px}.flag{top:12px}}

/* layout */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav.rail{display:none}}

nav.rail{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 12px}
nav.rail h3{margin:12px 8px 4px;font-size:15px;color:var(--accent);letter-spacing:.2px}
nav.rail h3:first-child{margin-top:2px}
nav.rail ol{list-style:none;margin:0;padding:0}
nav.rail button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;font-size:16px;color:var(--muted);cursor:default;line-height:1.3}
nav.rail button .n{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
nav.rail button.reach{cursor:pointer;color:var(--text)}
nav.rail button.reach:hover{background:var(--panel2)}
nav.rail button.done .n{background:var(--accent);border-color:var(--accent);color:#000}
nav.rail button.cur{background:var(--accent-soft);color:#fff;font-weight:700}
nav.rail button.cur .n{border-color:var(--accent);color:var(--accent)}
nav.rail button:focus-visible{outline:3px solid #fff;outline-offset:1px}

/* step card */
.card{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:6px;padding:26px 28px 28px;min-height:360px;transition:opacity .22s ease,transform .22s ease}
.card.out-next{opacity:0;transform:translateX(-34px)}
.card.out-prev{opacity:0;transform:translateX(34px)}
.card.in-next{opacity:0;transform:translateX(34px);transition:none}
.card.in-prev{opacity:0;transform:translateX(-34px);transition:none}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.meta .stage{color:var(--accent);font-weight:700}
.card h2{margin:6px 0 12px;font-size:clamp(26px,5vw,36px);line-height:1.2}
.card .txt{font-size:clamp(19px,3.3vw,22px);max-width:34em}
.card .txt b{color:var(--accent)}
.card .txt ul{margin:10px 0 0;padding-inline-start:22px}
.card .txt li{margin:6px 0}
.port{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 6px;border-radius:6px;background:var(--accent);color:#000;font-weight:700;font-size:20px;line-height:1;vertical-align:middle}
.figs{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:22px 0 6px}
.figs figure{margin:0}
.shot{background:#fff;border-radius:8px;padding:8px;cursor:zoom-in;border:0;display:block;transition:transform .2s}
.shot:hover{transform:scale(1.02)}
.shot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shot img{display:block;max-width:100%;height:auto}
figcaption{margin-top:6px;font-size:14px;color:var(--muted)}
.arrow{font-size:40px;color:var(--accent);line-height:1}
.note{margin:18px 0 0;padding:12px 16px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:17px;max-width:38em}
.note .lbl{color:var(--accent);font-weight:700;margin-inline-end:6px}
.note.warn{background:transparent;border:2px solid var(--accent)}
details{margin-top:16px;font-size:17px;max-width:38em}
summary{cursor:pointer;color:var(--accent);font-weight:700;list-style:none;display:inline-block;padding:6px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";}
details[open] summary::before{content:"− "}
summary:focus-visible{outline:3px solid #fff;outline-offset:3px}
details p{margin:6px 0 0;color:var(--muted)}

.actions{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:21px;min-height:54px;padding:10px 30px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:#000;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line);font-weight:400;font-size:18px}
.btn.ghost:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.35;cursor:default;transform:none}
.btn svg{width:26px;height:26px}
.btn .chk path{stroke-dasharray:30;stroke-dashoffset:30}
.btn.done .chk path{animation:draw .35s .05s ease forwards}
.btn.done .arr{display:none}
.btn:not(.done) .chk{display:none}
@keyframes draw{to{stroke-dashoffset:0}}
.hint{font-size:14px;color:var(--muted);margin-inline-start:auto}
@media(max-width:560px){.hint{display:none}.btn{width:100%;justify-content:center}.btn.ghost{width:auto}.card{padding:20px 16px 22px}}

/* end screen */
.end{text-align:start}
.bigchk{width:96px;height:96px;margin:6px 0 8px}
.bigchk circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:290;stroke-dashoffset:290;animation:draw 0.7s ease forwards}
.bigchk path{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .6s ease forwards}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;background:var(--accent);animation:fall linear forwards}
.confetti i:nth-child(3n){background:#fff;width:7px;height:7px}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:20;padding:16px;cursor:zoom-out}
.lb.open{display:grid}
.lb img{max-width:min(96vw,1100px);max-height:88vh;background:#fff;border-radius:8px;padding:10px}
.lb span{position:absolute;top:14px;left:18px;font-size:34px;line-height:1;color:#fff}

@media(prefers-reduced-motion:reduce){
  .card,.road .fill,.car,.shot,.btn{transition:none!important}
  .car.moving .wheel,.confetti i,.bigchk circle,.bigchk path,.btn.done .chk path{animation:none!important}
  .bigchk circle,.bigchk path,.btn.done .chk path{stroke-dashoffset:0!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>רכב אוטונומי: המדריך שלכם</h1>

var N=STEPS.length, KEY="t4k-av-guide-v1";
var st={i:0,max:0};
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var $=function(id){return document.getElementById(id)};
var card=$("card"),rail=$("rail"),car=$("car"),fill=$("fill"),dots=$("dots"),road=$("road");
var busy=false;

function load(){
  try{var v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&typeof v.i==="number"){st.i=Math.min(v.i,N);st.max=Math.min(Math.max(v.max||0,v.i),N)}}catch(e){}
  var m=/^#s(\d+)$/.exec(location.hash);
  if(m){var n=parseInt(m[1],10)-1;if(n>=0&&n<N){st.i=n;st.max=Math.max(st.max,n)}}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

function pos(r){return "calc("+r+" * (100% - 64px) + 32px)"}
function buildRoad(){
  var h="",seen={};
  STEPS.forEach(function(s,i){if(!seen[s.s]){seen[s.s]=1;h+='<div class="dot" data-s="'+s.s+'" data-i="'+i+'" style="right:'+pos(i/N)+'"><span>'+STAGES[s.s]+'</span></div>'}});
  dots.innerHTML=h;
}
function updateRoad(){
  var r=st.i/N;
  car.style.right="calc("+r+" * (100% - 64px))";
  fill.style.width=pos(r);
  road.setAttribute("aria-valuenow",st.i);
  var cur=st.i<N?STEPS[st.i].s:-1;
  [].forEach.call(dots.children,function(d){
    var i=+d.getAttribute("data-i");
    d.classList.toggle("on",i<=st.i&&st.i>0||i===0&&st.i>0);
    d.classList.toggle("cur",+d.getAttribute("data-s")===cur);
  });
  car.classList.add("moving");
  clearTimeout(updateRoad.t);
  updateRoad.t=setTimeout(function(){car.classList.remove("moving")},reduce?0:720);
}
function buildRail(){
  var h="",last=-1;
  STEPS.forEach(function(s,i){
    if(s.s!==last){if(last>=0)h+="</ol>";h+='<h3>'+(s.s+1)+'. '+STAGES[s.s]+'</h3><ol>';last=s.s}
    var cls=(i<st.i?"done ":"")+(i===st.i?"cur ":"")+(i<=st.max?"reach":"");
    h+='<li><button type="button" data-go="'+i+'" class="'+cls+'"'+(i<=st.max?"":" tabindex=\"-1\" aria-disabled=\"true\"")+(i===st.i?' aria-current="step"':"")+'><span class="n">'+(i<st.i?"✓":(i+1))+'</span><span>'+s.t+'</span></button></li>';
  });
  rail.innerHTML=h+"</ol>";
}
var CHK='<svg class="chk" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
var ARR='<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>';

function figs(list){
  if(!list)return"";
  return '<div class="figs">'+list.map(function(f){
    if(f.arrow)return '<span class="arrow" aria-hidden="true">←</span>';
    return '<figure><button class="shot" type="button" data-zoom="'+f.k+'" aria-label="הגדלת תמונה: '+f.c+'"><img src="'+IMG[f.k]+'" alt="'+f.c+'" style="width:'+f.w+'px"></button><figcaption>'+f.c+'</figcaption></figure>';
  }).join("")+"</div>";
}
function render(){
  var h;
  if(st.i>=N){
    h='<div class="end"><svg class="bigchk" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/><path d="M28 52l16 16 29-34"/></svg>'+
      '<h2>הקוד ב-HUB! כל הכבוד</h2><div class="txt">הרכב שלכם מוכן לנסיעה.<br>חזרו למצגת והמשיכו לשלב הבא.</div>'+
      '<div class="actions"><button class="btn" id="again" type="button">מתחילים מחדש</button><button class="btn ghost" id="back" type="button">חזרה לשלב האחרון</button></div></div>';
  }else{
    var s=STEPS[st.i];
    h='<div class="meta"><span class="stage">'+(s.s+1)+'. '+STAGES[s.s]+'</span><span>שלב '+(st.i+1)+' מתוך '+N+'</span></div>'+
      '<h2>'+s.t+'</h2><div class="txt">'+s.h+'</div>'+figs(s.img)+
      (s.tip?'<div class="note"><span class="lbl">טיפ:</span>'+s.tip+'</div>':"")+
      (s.warn?'<div class="note warn"><span class="lbl">⚠ שימו לב:</span>'+s.warn+'</div>':"")+
      (s.help?'<details><summary>נתקעתי? לחצו כאן</summary><p>'+s.help+'</p></details>':"")+
      '<div class="actions"><button class="btn" id="next" type="button"><span class="lbl">סיימתי</span>'+CHK+ARR+'</button>'+
      '<button class="btn ghost" id="back" type="button"'+(st.i===0?" disabled":"")+'>חזרה</button><span class="hint">מקש חץ שמאלה: הלאה</span></div>';
  }
  card.innerHTML=h;
  buildRail();updateRoad();save();
  try{history.replaceState(null,"",st.i<N?"#s"+(st.i+1):"#done")}catch(e){}
}
function go(to,dir){
  if(busy||to===st.i||to<0||to>N)return;
  busy=true;
  var o=dir>0?"out-next":"out-prev",n=dir>0?"in-next":"in-prev";
  var d=reduce?0:230;
  card.classList.add(o);
  setTimeout(function(){
    st.i=to;if(to>st.max)st.max=to;
    render();
    card.classList.remove(o);card.classList.add(n);
    void card.offsetWidth;card.classList.remove(n);
    busy=false;
    if(to===N)burst();
    var t=card.querySelector("h2");if(t){t.setAttribute("tabindex","-1");t.focus({preventScroll:true})}
    var top=card.getBoundingClientRect().top;if(top<0||top>window.innerHeight*.6){card.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"})}
  },d);
}
function finish(){
  if(busy)return;
  var b=$("next");if(!b)return;
  b.classList.add("done");b.querySelector(".lbl").textContent="יופי!";
  setTimeout(function(){go(st.i+1,1)},reduce?0:520);
}
function burst(){
  if(reduce)return;
  var c=$("confetti"),h="";
  for(var i=0;i<42;i++){h+='<i style="right:'+(Math.random()*100)+'%;animation-duration:'+(1.8+Math.random()*1.8)+'s;animation-delay:'+(Math.random()*.5)+'s;transform:rotate('+(Math.random()*180)+'deg)"></i>'}
  c.innerHTML=h;setTimeout(function(){c.innerHTML=""},4200);
}

document.addEventListener("click",function(e){
  var t=e.target;
  var z=t.closest&&t.closest("[data-zoom]");
  if(z){$("lbimg").src=IMG[z.getAttribute("data-zoom")];$("lb").classList.add("open");return}
  if(t.closest&&t.closest("#lb")){$("lb").classList.remove("open");return}
  var g=t.closest&&t.closest("[data-go]");
  if(g){var i=+g.getAttribute("data-go");if(i<=st.max)go(i,i>st.i?1:-1);return}
  var b=t.closest&&t.closest("button");if(!b)return;
  if(b.id==="next")finish();
  else if(b.id==="back"){go(st.i>=N?N-1:st.i-1,-1)}
  else if(b.id==="again"){st.max=0;go(0,-1)}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){$("lb").classList.remove("open");return}
  if($("lb").classList.contains("open")||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==="ArrowLeft"&&st.i<N){finish()}
  else if(e.key==="ArrowRight"&&st.i>0){go(st.i-1,-1)}
});
window.addEventListener("hashchange",function(){
  var m=/^#s(\d+)$/.exec(location.hash);if(!m)return;
  var n=parseInt(m[1],10)-1;if(n>=0&&n<N&&n<=st.max&&n!==st.i)go(n,n>st.i?1:-1);
});

load();buildRoad();render();
})();
</script>
</body>
</html>
